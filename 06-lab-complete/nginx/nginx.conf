# Nginx — Load Balancer (cân bằng tải) cho nhiều agent instance.
# Phân phối request tới các agent qua DNS round-robin của Docker Compose.
events { worker_connections 1024; }

http {
    # 'agent' là service name trong docker-compose; Docker DNS trả nhiều IP
    # khi scale agent=3 => Nginx tự cân bằng tải giữa các instance.
    upstream agent_backend {
        server agent:8000;
    }

    server {
        listen 80;

        # Health check của chính LB
        location /lb-health {
            return 200 "load-balancer ok\n";
        }

        location / {
            proxy_pass         http://agent_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            # Nếu 1 instance lỗi, thử instance khác (failover).
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
