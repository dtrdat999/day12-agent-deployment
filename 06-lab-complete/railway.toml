[build]
builder = "DOCKERFILE"

[deploy]
# Railway tự inject $PORT — đọc từ env, không hardcode.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-graceful-shutdown 30"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
