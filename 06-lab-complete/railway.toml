[build]
builder = "DOCKERFILE"

[deploy]
# KHÔNG đặt startCommand chứa $PORT ở đây: Railway chạy start command không qua
# shell nên "$PORT" không bung => uvicorn lỗi "'$PORT' is not a valid integer".
# Để trống -> dùng CMD trong Dockerfile (đã bọc `sh -c`, bung ${PORT:-8000} đúng).
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
