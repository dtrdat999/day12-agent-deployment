[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand ở đây: Railway chạy nó KHÔNG qua shell nên "$PORT" không
# được bung thành số => uvicorn lỗi "'$PORT' is not a valid integer".
# Bỏ trống để Railway dùng CMD trong Dockerfile (đã bọc `sh -c` nên ${PORT:-8000} bung đúng).
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
